[project]
name = "oauth2-fastapi"
version = "0.1.0"
description = "An implementation of Oauth2 flows, using FastAPI."
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "coloredlogs>=15.0.1",
    "cryptography>=48.0.1",
    "fastapi[standard]>=0.128.4",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.46",
    "tomlkit>=0.15.0",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pdbpp>=0.12.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.0",
]
testing = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-order>=1.3.0",
    "pytest-randomly>=4.0.1",
]

[tool.uv]
default-groups = ["dev", "testing"]


[tool.ruff]
target-version = 'py314'
line-length = 88
lint.select = [
    "E",  # pycodestyle
    "W",  # pycodestyle
    "F",  # pyflakes
    "UP",  # pyupgrade
    "C90",  # mccabe
    "D",  # pydocstyle
    "PL",  # pylint
    "I",  # isort
    "ASYNC",  # flake8-async
    "YTT",  # flake8-2020
    # "S",  # flake8-bandit
    # "BLE",  # flake8-blind-except
    # "B",  # flake8-bugbear
    # "C4",  # flake8-comprehension
    # "PTH",  # flake8-use-pathlib
    # "PYI",  # flake8-pyi
    # "T10",  # flake8-debugger
    # "DTZ",  # flake8-datetimez
    "RUF",  # Ruff specific rules
    "FAST",  # FastAPI specific rules
    # "TRY",  # tryceraptos specific rules
]
lint.ignore = ["D104"]
lint.exclude = ["*/alembic/*", "*/migrations/*"]

lint.fixable = [
    "F401",  # Remove unused imports.
    "RUF100",  # Remove unused noqa comments.
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true


[tool.mypy]
strict = true
ignore_missing_imports = true

exclude = ["tests/", "config/migrations/"]

plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-v",
]
markers = [
    "smoke: Tests focusing on essential and critical functionality",
    "exception: Tests checking how the application handles exceptions and error scenarios",
    "asyncio: Asynchronous tests using the pytest-asyncio plugin",
]
required_plugins = [
    "pytest-randomly",
    "pytest-cov",
]

testpaths = "tests"
xfail_strict = true


[tool.coverage.run]
parallel = true
source = [
    "app",
    "toolkit",
]
